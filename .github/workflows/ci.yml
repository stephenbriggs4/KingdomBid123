name: FaithBid CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:dependency-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/check-lint-baseline.mjs
      - run: npm run build
      - run: npm run test:build-budget
      - run: npm run test:migration-integrity
      - run: npm run test:hardening
      - run: npm run test:launch-surface
      - run: npm run test:my-projects-routing
      - run: npm run test:budget-truth
      - run: npm run test:reconciliation-regressions
      - run: npm run test
